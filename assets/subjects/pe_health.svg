<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="peBg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#4c0519"/>
      <stop offset="45%" stop-color="#1f020a"/>
      <stop offset="100%" stop-color="#0a0104"/>
    </radialGradient>
    <radialGradient id="trophyGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#e11d48" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#881337" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#peBg)"/>

  <!-- TOP-LEFT: Vital ECG Heartbeat & Stopwatch -->
  <g transform="translate(140, 110)">
    <rect x="0" y="0" width="380" height="150" rx="14" fill="rgba(31, 2, 10, 0.75)" stroke="#f43f5e" stroke-width="2.5"/>
    <text x="20" y="32" fill="#fda4af" font-size="13" font-family="monospace" font-weight="bold">HEART RATE MONITOR • BPM 138</text>
    <!-- ECG Pulse wave -->
    <path d="M 10,85 L 60,85 L 75,70 L 90,100 L 105,85 L 130,85 L 145,30 L 160,135 L 175,20 L 190,110 L 205,85 L 240,85 L 255,70 L 270,95 L 285,85 L 360,85" stroke="#fb7185" stroke-width="3.5" fill="none"/>
  </g>

  <!-- HERO RIGHT: Golden Sports Victory Trophy & Laurel Wreath -->
  <g transform="translate(1550, 360)">
    <circle cx="0" cy="0" r="220" fill="url(#trophyGlow)"/>
    <!-- Trophy Cup -->
    <path d="M -90,-120 L 90,-120 L 70,10 C 60,80 0,100 0,100 C 0,100 -60,80 -70,10 Z" fill="#fbbf24" stroke="#f59e0b" stroke-width="4"/>
    <!-- Cup Rim & Base -->
    <ellipse cx="0" cy="-120" rx="90" ry="18" fill="#fef08a"/>
    <rect x="-15" y="100" width="30" height="60" fill="#d97706"/>
    <rect x="-70" y="160" width="140" height="30" rx="6" fill="#b45309"/>
    <!-- Handles -->
    <path d="M -85,-90 C -150,-90 -140,-10 -70,0" stroke="#f59e0b" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M 85,-90 C 150,-90 140,-10 70,0" stroke="#f59e0b" stroke-width="12" fill="none" stroke-linecap="round"/>
    <text x="0" y="10" fill="#b45309" font-size="44" font-weight="bold" font-family="sans-serif" text-anchor="middle">★</text>
  </g>

  <!-- BOTTOM: Athletic Running Track Lanes -->
  <g stroke="#f43f5e" stroke-width="2.5" fill="none" opacity="0.6">
    <ellipse cx="960" cy="1150" rx="920" ry="320"/>
    <ellipse cx="960" cy="1180" rx="980" ry="340"/>
    <ellipse cx="960" cy="1210" rx="1040" ry="360"/>
    <ellipse cx="960" cy="1240" rx="1100" ry="380"/>
  </g>
</svg>