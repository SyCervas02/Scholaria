<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="physBg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#2e1065"/>
      <stop offset="50%" stop-color="#0f0728"/>
      <stop offset="100%" stop-color="#030014"/>
    </radialGradient>
    <radialGradient id="atomCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#f43f5e"/>
      <stop offset="70%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#030014" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="prismRainbow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="20%" stop-color="#f97316"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="60%" stop-color="#22c55e"/>
      <stop offset="80%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#physBg)"/>

  <!-- TOP-LEFT: Light Prism dispersing Rainbow Spectrum -->
  <g transform="translate(120, 100)">
    <!-- White beam entering -->
    <line x1="20" y1="120" x2="180" y2="170" stroke="#ffffff" stroke-width="4"/>
    <!-- Glass Triangle Prism -->
    <polygon points="220,70 160,210 280,210" fill="rgba(255,255,255,0.12)" stroke="#a855f7" stroke-width="3"/>
    <!-- Refracted Rainbow Rays -->
    <polygon points="230,165 460,110 460,250 240,195" fill="url(#prismRainbow)" opacity="0.8"/>
  </g>

  <!-- Left: Spacetime Curvature Grid -->
  <g transform="translate(140, 420)" stroke="#7c3aed" stroke-width="1.5" fill="none" opacity="0.45">
    <ellipse cx="200" cy="180" rx="180" ry="70"/>
    <ellipse cx="200" cy="190" rx="130" ry="50"/>
    <ellipse cx="200" cy="200" rx="80" ry="30"/>
    <path d="M 20,180 Q 200,240 380,180"/>
    <path d="M 200,110 L 200,230"/>
  </g>

  <!-- Formulas -->
  <g font-family="serif" font-style="italic" fill="#e9d5ff" opacity="0.85">
    <text x="180" y="370" font-size="36" font-weight="bold">E = mc²</text>
    <text x="160" y="690" font-size="28">F = G(m₁m₂ / r²)</text>
    <text x="180" y="750" font-size="26">Δx · Δp ≥ ℏ/2</text>
  </g>

  <!-- HERO RIGHT: GIANT QUANTUM ATOM MODEL (Iconic!) -->
  <g transform="translate(1560, 380)">
    <!-- Core Nucleus Glow -->
    <circle cx="0" cy="0" r="60" fill="url(#atomCore)"/>
    <circle cx="-10" cy="-8" r="14" fill="#ef4444"/>
    <circle cx="12" cy="-10" r="14" fill="#3b82f6"/>
    <circle cx="-6" cy="14" r="14" fill="#3b82f6"/>
    <circle cx="14" cy="12" r="14" fill="#ef4444"/>

    <!-- 3 Orbital Ellipses -->
    <g stroke="#38bdf8" stroke-width="4" fill="none">
      <ellipse cx="0" cy="0" rx="260" ry="90" transform="rotate(0)"/>
      <ellipse cx="0" cy="0" rx="260" ry="90" transform="rotate(60)"/>
      <ellipse cx="0" cy="0" rx="260" ry="90" transform="rotate(120)"/>
    </g>

    <!-- Electrons in orbit -->
    <circle cx="260" cy="0" r="12" fill="#38bdf8"><animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="-130" cy="-225" r="12" fill="#a855f7"/>
    <circle cx="-130" cy="225" r="12" fill="#f43f5e"/>
  </g>

  <!-- Floating particles & electromagnetic waves -->
  <path d="M 0,920 Q 240,840 480,920 T 960,920 T 1440,920 T 1920,920" stroke="#06b6d4" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M 0,960 Q 240,1040 480,960 T 960,960 T 1440,960 T 1920,960" stroke="#ec4899" stroke-width="2.5" fill="none" opacity="0.5"/>
</svg>