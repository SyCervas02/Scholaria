<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="bizBg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#062319"/>
      <stop offset="45%" stop-color="#03140e"/>
      <stop offset="100%" stop-color="#010806"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bullishGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="towerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Deep Emerald / Navy Corporate Wealth Canvas -->
  <rect width="100%" height="100%" fill="url(#bizBg)"/>

  <!-- Perspective Financial Market Grid -->
  <g stroke="#059669" stroke-width="1" opacity="0.2">
    <line x1="0" y1="750" x2="1920" y2="750"/>
    <line x1="0" y1="820" x2="1920" y2="820"/>
    <line x1="0" y1="900" x2="1920" y2="900"/>
    <line x1="0" y1="990" x2="1920" y2="990"/>
    <line x1="960" y1="700" x2="200" y2="1080"/>
    <line x1="960" y1="700" x2="500" y2="1080"/>
    <line x1="960" y1="700" x2="800" y2="1080"/>
    <line x1="960" y1="700" x2="1120" y2="1080"/>
    <line x1="960" y1="700" x2="1420" y2="1080"/>
    <line x1="960" y1="700" x2="1720" y2="1080"/>
  </g>

  <!-- TOP-LEFT: Corporate Financial District Towers & Analytics Dashboard -->
  <g opacity="0.85">
    <!-- Corporate Skyscrapers -->
    <rect x="80" y="160" width="90" height="360" fill="url(#towerGrad)" stroke="#10b981" stroke-width="1.5"/>
    <rect x="190" y="110" width="120" height="410" fill="url(#towerGrad)" stroke="#34d399" stroke-width="2"/>
    <rect x="330" y="190" width="85" height="330" fill="url(#towerGrad)" stroke="#10b981" stroke-width="1.5"/>
    
    <!-- Illuminated Office Windows -->
    <g fill="#fbbf24" opacity="0.6">
      <rect x="100" y="190" width="14" height="8"/>
      <rect x="130" y="190" width="14" height="8"/>
      <rect x="100" y="220" width="14" height="8"/>
      <rect x="130" y="250" width="14" height="8"/>
      <rect x="215" y="140" width="18" height="10"/>
      <rect x="250" y="140" width="18" height="10"/>
      <rect x="215" y="170" width="18" height="10"/>
      <rect x="275" y="200" width="18" height="10"/>
      <rect x="215" y="240" width="18" height="10"/>
      <rect x="250" y="280" width="18" height="10"/>
      <rect x="350" y="220" width="14" height="8"/>
      <rect x="380" y="250" width="14" height="8"/>
    </g>

    <!-- Holographic Financial Analytics Card / Bar Chart -->
    <rect x="70" y="460" width="360" height="180" rx="16" fill="#022c22" fill-opacity="0.7" stroke="#10b981" stroke-width="2"/>
    <text x="95" y="495" fill="#6ee7b7" font-family="monospace" font-size="14" font-weight="bold">MARKET GROWTH · +34.8%</text>
    <!-- Bar charts -->
    <rect x="100" y="570" width="28" height="50" rx="4" fill="#059669"/>
    <rect x="145" y="540" width="28" height="80" rx="4" fill="#10b981"/>
    <rect x="190" y="555" width="28" height="65" rx="4" fill="#059669"/>
    <rect x="235" y="515" width="28" height="105" rx="4" fill="#34d399"/>
    <rect x="280" y="495" width="28" height="125" rx="4" fill="#6ee7b7"/>
    <rect x="325" y="480" width="28" height="140" rx="4" fill="url(#goldGrad)"/>
  </g>

  <!-- TOP-RIGHT: Giant Bullish Candlestick Market Chart, Exponential Trajectory & Gold Coin Stacks -->
  <g transform="translate(1550, 320)">
    <circle cx="0" cy="0" r="260" fill="url(#goldGlow)" opacity="0.55"/>

    <!-- Candlestick chart elements -->
    <!-- Candle 1 (Green) -->
    <line x1="-200" y1="-60" x2="-200" y2="160" stroke="#10b981" stroke-width="3"/>
    <rect x="-215" y="-30" width="30" height="130" rx="5" fill="url(#bullishGreen)" stroke="#6ee7b7" stroke-width="2"/>

    <!-- Candle 2 (Amber) -->
    <line x1="-130" y1="-100" x2="-130" y2="90" stroke="#f59e0b" stroke-width="3"/>
    <rect x="-145" y="-60" width="30" height="80" rx="5" fill="#d97706" stroke="#fde68a" stroke-width="2"/>

    <!-- Candle 3 (Strong Green) -->
    <line x1="-60" y1="-160" x2="-60" y2="60" stroke="#10b981" stroke-width="3"/>
    <rect x="-75" y="-120" width="30" height="140" rx="5" fill="url(#bullishGreen)" stroke="#6ee7b7" stroke-width="2"/>

    <!-- Candle 4 (Massive Bullish Breakout) -->
    <line x1="15" y1="-240" x2="15" y2="-10" stroke="#34d399" stroke-width="3.5"/>
    <rect x="0" y="-200" width="30" height="160" rx="5" fill="url(#bullishGreen)" stroke="#a7f3d0" stroke-width="2.5"/>

    <!-- Candle 5 (Peak Golden High) -->
    <line x1="90" y1="-280" x2="90" y2="-80" stroke="#fbbf24" stroke-width="3.5"/>
    <rect x="75" y="-260" width="30" height="150" rx="5" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="2"/>

    <!-- Rising Exponential Golden Profit Line -->
    <path d="M -240,110 Q -120,-30 0,-140 T 170,-280" stroke="url(#goldGrad)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- Arrowhead at peak -->
    <polygon points="170,-280 140,-270 160,-250" fill="#fef08a"/>

    <!-- Stack of Golden Currency Coins (Peso / Dollar) -->
    <g transform="translate(80, 120)">
      <!-- Coin 1 bottom -->
      <ellipse cx="0" cy="60" rx="60" ry="22" fill="#b45309" stroke="#f59e0b" stroke-width="3"/>
      <ellipse cx="0" cy="52" rx="60" ry="22" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="2.5"/>
      <!-- Coin 2 middle -->
      <ellipse cx="0" cy="35" rx="60" ry="22" fill="#b45309" stroke="#f59e0b" stroke-width="3"/>
      <ellipse cx="0" cy="27" rx="60" ry="22" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="2.5"/>
      <!-- Coin 3 top -->
      <ellipse cx="0" cy="10" rx="60" ry="22" fill="#b45309" stroke="#f59e0b" stroke-width="3"/>
      <ellipse cx="0" cy="2" rx="60" ry="22" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="2.5"/>
      <text x="0" y="10" text-anchor="middle" fill="#78350f" font-family="sans-serif" font-size="24" font-weight="900">₱</text>
    </g>

    <!-- Floating Currency Symbols -->
    <g fill="#fef08a" font-family="sans-serif" font-size="26" font-weight="bold" opacity="0.85">
      <text x="-180" y="-180">%</text>
      <text x="-70" y="-230">$</text>
      <path d="M118 -129v-17h6v9l9-10 8 8 15-17 5 5-20 23-8-8-4 5v2z" transform="translate(0 0)"/>
    </g>
  </g>

  <!-- BOTTOM: Golden Ledger Horizon & Corporate Balance Accents -->
  <path d="M 0,980 L 400,940 L 800,970 L 1200,930 L 1600,960 L 1920,930 L 1920,1080 L 0,1080 Z" fill="#022c22" opacity="0.8"/>
  <path d="M 0,1020 L 500,990 L 1000,1020 L 1500,985 L 1920,1010 L 1920,1080 L 0,1080 Z" fill="#064e3b" opacity="0.9"/>
  <line x1="0" y1="980" x2="1920" y2="930" stroke="#10b981" stroke-width="3" opacity="0.6"/>
  <line x1="0" y1="1020" x2="1920" y2="985" stroke="#f59e0b" stroke-width="3" opacity="0.8"/>
</svg>
